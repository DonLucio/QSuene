name: CI

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: platform/backend/pyproject.toml
      - run: python -m pip install -e "./platform/backend[dev]"
      - run: python -m pytest -q
        working-directory: platform/backend

  socket-contracts:
    name: Socket.IO contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: platform/backend/pyproject.toml
      - run: python -m pip install -e "./platform/backend[dev]"
      - run: python scripts/validate_socket_contract.py
      - run: python -m pytest -q tests/test_event_contracts.py
        working-directory: platform/backend

  download-tests:
    name: Download tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: desktop/requirements-dev.txt
      - run: python -m pip install -r desktop/requirements-dev.txt
      - run: python -m pytest desktop/app/test_download_jobs.py -q

  dj-lint:
    name: DJ App lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci
        working-directory: desktop/frontend
      - run: npm run lint
        working-directory: desktop/frontend

  dj-build:
    name: DJ frontend build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci
        working-directory: desktop/frontend
      - run: npm run build
        working-directory: desktop/frontend

  guest-build:
    name: WebGuest build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/guest-web/package-lock.json
      - run: npm ci
        working-directory: platform/guest-web
      - run: npm run build
        working-directory: platform/guest-web

  forbidden-files:
    name: Forbidden files audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python scripts/audit_forbidden_files.py

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate the production Compose model
        run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet

  ci-success:
    name: CI success
    if: always()
    needs: [backend-tests, socket-contracts, download-tests, dj-lint, dj-build, guest-build, forbidden-files, secret-scan, compose-validation]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every quality gate
        env:
          BACKEND: ${{ needs.backend-tests.result }}
          CONTRACTS: ${{ needs.socket-contracts.result }}
          DOWNLOADS: ${{ needs.download-tests.result }}
          DJ_LINT: ${{ needs.dj-lint.result }}
          DJ_BUILD: ${{ needs.dj-build.result }}
          GUEST_BUILD: ${{ needs.guest-build.result }}
          FILES: ${{ needs.forbidden-files.result }}
          SECRETS: ${{ needs.secret-scan.result }}
          COMPOSE: ${{ needs.compose-validation.result }}
        run: |
          RESULTS="$BACKEND $CONTRACTS $DOWNLOADS $DJ_LINT $DJ_BUILD $GUEST_BUILD $FILES $SECRETS $COMPOSE"
          echo "Results: $RESULTS"
          test "$RESULTS" = "success success success success success success success success success"
