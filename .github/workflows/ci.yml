name: CI

on:
  push:
    branches: [main, "release/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: platform/backend/pyproject.toml
      - run: python -m pip install -e "./platform/backend[dev]"
      - run: python -m pytest -q
        working-directory: platform/backend

  web:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        project: [desktop/frontend, platform/guest-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.project }}
      - name: Lint DJ frontend
        if: matrix.project == 'desktop/frontend'
        run: npm run lint
        working-directory: ${{ matrix.project }}
      - run: npm run build
        working-directory: ${{ matrix.project }}

  desktop:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: desktop/requirements-dev.txt
      - run: python -m pip install -r desktop/requirements-dev.txt
      - run: python -m pytest desktop/app/test_download_jobs.py -q
      - run: python -m compileall -q desktop/app
