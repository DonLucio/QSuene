<VirtualHost *:80>
    ServerName qsuene.com
    ServerAlias www.qsuene.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName qsuene.com
    ServerAlias www.qsuene.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/qsuene.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/qsuene.com/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off

    # Socket.IO comienza con HTTP y puede actualizar la conexión a WebSocket.
    ProxyPass        /socket.io/ http://127.0.0.1:8000/socket.io/ upgrade=websocket timeout=600
    ProxyPassReverse /socket.io/ http://127.0.0.1:8000/socket.io/

    ProxyPass        /api/ http://127.0.0.1:8000/api/ timeout=30
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/

    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    RequestHeader set X-Forwarded-Proto "https"
    ErrorLog ${APACHE_LOG_DIR}/que-suene-party-error.log
    CustomLog ${APACHE_LOG_DIR}/que-suene-party-access.log combined
</VirtualHost>
