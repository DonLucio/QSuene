[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "que-suene-party-server"
version = "0.1.0"
description = "Servidor de rooms en línea para Que Suene"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "python-socketio>=5.12,<6",
  "redis>=5.2,<7",
  "asyncpg>=0.30,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "requests>=2.32,<3",
  "websocket-client>=1.8,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
